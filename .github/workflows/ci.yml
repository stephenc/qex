name: CI

# Every push and every pull request. The release workflow runs the same tests
# again on main, because a release must never come from an untested commit.
on:
  push:
    branches: [main]
  pull_request:

# A new push to one branch stops the run of the earlier push. The result of the
# earlier push has no value once a newer commit exists.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  style:
    name: Style
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy
      - uses: Swatinem/rust-cache@v2
      - name: The layout of the code
        run: cargo fmt --all --check
      - name: The advice of clippy
        run: cargo clippy --all-targets -- -D warnings

  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Each version is named, and `ubuntu-latest` is not used. qex reads
        # /proc and controls processes, so the version of the system is part of
        # the test. A name that moves would change the test with no commit, and
        # a failure would then have no cause that a person can see.
        #
        # Two versions of Ubuntu, because a fault that appears on one of them
        # and not on the other says immediately where to look.
        os: [ubuntu-22.04, ubuntu-24.04, macos-14]
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal
      - uses: Swatinem/rust-cache@v2
      - name: The unit tests
        run: cargo test --bins
      # The end-to-end tests start real processes, and a coordinator makes a
      # decision from the load of the machine. Two of these tests together on a
      # shared machine change that load, so they run two at a time at the most.
      - name: The end-to-end tests
        run: cargo test --test e2e -- --test-threads=2

  # Cargo.toml names the earliest version of Rust that qex needs. A number that
  # nothing tests is a guess, and a user with that version meets the error.
  msrv:
    name: The earliest Rust that qex needs
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Read the number from Cargo.toml
        id: msrv
        run: |
          version="$(awk -F'"' '/^rust-version *= *"/ { print $2; exit }' Cargo.toml)"
          echo "version=$version" >>"$GITHUB_OUTPUT"
          echo "Cargo.toml says that qex needs Rust $version."
      - run: rustup toolchain install ${{ steps.msrv.outputs.version }} --profile minimal
      - uses: Swatinem/rust-cache@v2
        with:
          key: msrv-${{ steps.msrv.outputs.version }}
      - run: cargo +${{ steps.msrv.outputs.version }} check --all-targets --locked

  # The title of the pull request is the message of the commit that reaches
  # `main`, because this repository accepts a squash only. The version number of
  # a release comes from that message, so this test guards the release.
  #
  # This job read the commits of the BRANCH until 2026-08-07. Those messages
  # never reach `main`, so the one message that decides the release was the one
  # message that nothing tested.
  title:
    name: The form of the pull request title
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v5
      - name: The title must follow Conventional Commits
        # The title goes through the environment, and never into the text of the
        # command. A person outside this project can write a title, and text
        # inside a command becomes part of that command.
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: .github/scripts/check-title.sh "$TITLE"

  # Prove that each target of the release builds, before a merge to main and not
  # after it. A release that fails to build for one machine is a release that
  # must be made again.
  cross:
    name: Build for ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-24.04
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04
          - target: x86_64-apple-darwin
            os: macos-14
          - target: aarch64-apple-darwin
            os: macos-14
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust for ${{ matrix.target }}
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      # qex has no dependency that holds C, so the linker of Rust itself can
      # make a binary for another machine. No other toolchain is necessary.
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: rust-lld
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: rust-lld
