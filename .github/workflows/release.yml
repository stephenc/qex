name: Release

# A merge to main. The commit messages since the last tag give the next version
# number; see .github/scripts/next-version.sh for the rules.
on:
  push:
    branches: [main]
  workflow_dispatch:

# One release at a time. Two together would compute one version number twice.
# Do not stop a run that operates: it holds a tag and a release.
concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    name: The next version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.next.outputs.version }}
      bump: ${{ steps.next.outputs.bump }}
      previous: ${{ steps.next.outputs.previous }}
      release: ${{ steps.next.outputs.bump != 'none' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: next
        run: .github/scripts/next-version.sh | tee -a "$GITHUB_OUTPUT"
      - name: Say what happens
        run: |
          if [ "${{ steps.next.outputs.bump }}" = "none" ]; then
            echo "No commit since ${{ steps.next.outputs.previous }} asks for a release." \
              >>"$GITHUB_STEP_SUMMARY"
          else
            echo "The next release is **v${{ steps.next.outputs.version }}**" \
              "(${{ steps.next.outputs.bump }})." >>"$GITHUB_STEP_SUMMARY"
          fi

  # The tests run again here. The tests of the pull request ran against the
  # branch; this runs against the commit that becomes the release.
  test:
    name: Test on ${{ matrix.os }}
    needs: version
    if: needs.version.outputs.release == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, macos-14]
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --bins
      - run: cargo test --test e2e -- --test-threads=2

  build:
    name: Build ${{ matrix.name }}
    needs: [version, test]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: true
      matrix:
        include:
          # The name of each file follows `uname -s` and `uname -m`, so that a
          # reader can take the correct file with one line of shell.
          - name: Linux-x86_64
            target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - name: Linux-aarch64
            target: aarch64-unknown-linux-musl
            os: ubuntu-latest
          - name: Darwin-x86_64
            target: x86_64-apple-darwin
            os: macos-14
          - name: Darwin-arm64
            target: aarch64-apple-darwin
            os: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust for ${{ matrix.target }}
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      # Each build puts the same number in Cargo.toml before it starts. The tag
      # comes later, after every build is complete, so a build that fails leaves
      # no tag and no release behind it.
      - name: Set the version to ${{ needs.version.outputs.version }}
        run: .github/scripts/set-version.sh "${{ needs.version.outputs.version }}"

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: rust-lld
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: rust-lld

      # The binary must report the number of this release. A binary compares its
      # own number against the number of the coordinator that operates, and it
      # gives a warning when the two differ. A wrong number makes that warning
      # useless. A binary for another machine cannot run here, so this step
      # tests the binary of this machine only.
      - name: The binary reports the version
        if: matrix.target == 'x86_64-unknown-linux-musl' || matrix.target == 'aarch64-apple-darwin'
        run: |
          got="$(./target/${{ matrix.target }}/release/qex --version)"
          echo "$got"
          [ "$got" = "qex ${{ needs.version.outputs.version }}" ] || {
            echo "the binary reports \`$got\`, and this release is" \
                 "\`qex ${{ needs.version.outputs.version }}\`" >&2
            exit 1
          }

      - name: Make the file
        run: |
          file="qex-${{ matrix.name }}.tar.gz"
          tar -czf "$file" -C "target/${{ matrix.target }}/release" qex
          shasum -a 256 "$file" >"$file.sha256"
          cat "$file.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: qex-${{ matrix.name }}
          path: |
            qex-${{ matrix.name }}.tar.gz
            qex-${{ matrix.name }}.tar.gz.sha256
          retention-days: 7
          if-no-files-found: error

  publish:
    name: Tag and publish
    needs: [version, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # The default token cannot start another workflow with its own push,
          # which is what stops this workflow from starting itself. The commit
          # below says `chore`, which asks for no release, so the guard is two
          # deep.
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/download-artifact@v4
        with:
          path: files
          merge-multiple: true

      - name: Write the version into the commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          .github/scripts/set-version.sh "${{ needs.version.outputs.version }}"
          git add Cargo.toml Cargo.lock
          # A person can put the number in Cargo.toml before the merge, and the
          # release then agrees with the file already. There is nothing to
          # commit in that case, and that is a correct state and not a fault.
          if git diff --cached --quiet; then
            echo "Cargo.toml holds this number already, so there is no commit to make."
          else
            git commit -m "chore(release): v${{ needs.version.outputs.version }}"
          fi
          # The tag goes on the commit that the build tested, either way.
          git tag -a "v${{ needs.version.outputs.version }}" \
            -m "qex ${{ needs.version.outputs.version }}"

      # Another merge can arrive between the start of this workflow and this
      # push. Put the release commit on top of that merge, and try again. The
      # release still describes the commit that this workflow tested, because
      # the tag holds this commit.
      - name: Push the commit and the tag
        run: |
          for attempt in 1 2 3; do
            if git push origin HEAD:main --follow-tags; then
              exit 0
            fi
            echo "the push failed. Attempt $attempt of 3."
            git pull --rebase origin main
          done
          echo "three pushes failed. Somebody must look at main." >&2
          exit 1

      - name: Write the notes
        run: |
          .github/scripts/release-notes.sh \
            "${{ needs.version.outputs.version }}" \
            "${{ needs.version.outputs.previous }}" >notes.md
          cat notes.md >>"$GITHUB_STEP_SUMMARY"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ needs.version.outputs.version }}" \
            --title "qex ${{ needs.version.outputs.version }}" \
            --notes-file notes.md \
            files/*

  # crates.io, so that a user can write `cargo install qex`.
  #
  # This job comes after the release, and a failure here does not remove the
  # release: the binaries are the primary way to get qex, and crates.io is the
  # second way. The job does nothing while the secret CARGO_REGISTRY_TOKEN does
  # not exist, so the workflow is complete before the token arrives.
  crate:
    name: Publish to crates.io
    needs: [version, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v${{ needs.version.outputs.version }}
      - run: rustup toolchain install stable --profile minimal
      - uses: Swatinem/rust-cache@v2

      - name: Publish
        # `cargo publish` reads this variable itself. A token on the command
        # line would appear in the process list of the machine.
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "No CARGO_REGISTRY_TOKEN secret exists, so this step does nothing." \
              >>"$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          cargo publish --locked
