[package]
name = "qex"
version = "0.5.1"
edition = "2021"
description = "Queued EXecutor — a resource-aware local job queue for long-running tasks"
license = "Apache-2.0"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
serde_yaml_ng = "0.10"
uuid = { version = "1", features = ["v4", "serde"] }
libc = "0.2"
anyhow = "1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true

[dev-dependencies]
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
libc = "0.2"
